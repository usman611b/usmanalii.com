name = "usmanalii-worker"
main = "src/index.ts"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
ENVIRONMENT = "local"

[[d1_databases]]
binding = "DB"
database_name = "usmanalii-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../../packages/database/migrations"

[[r2_buckets]]
binding = "R2_PRIVATE"
bucket_name = "usmanalii-private-local"

[[r2_buckets]]
binding = "R2_PUBLIC"
bucket_name = "usmanalii-public-local"

[triggers]
crons = []

# ---------------------------------------------------------------------------
# Local development
# ---------------------------------------------------------------------------
[env.local]
vars = { ENVIRONMENT = "local", LOG_LEVEL = "debug" }

[[env.local.d1_databases]]
binding = "DB"
database_name = "usmanalii-local"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../../packages/database/migrations"

[[env.local.r2_buckets]]
binding = "R2_PRIVATE"
bucket_name = "usmanalii-private-local"

[[env.local.r2_buckets]]
binding = "R2_PUBLIC"
bucket_name = "usmanalii-public-local"

# ---------------------------------------------------------------------------
# Preview (branch preview deployments)
# SECURITY: MUST use synthetic data bindings, not staging or production.
# ---------------------------------------------------------------------------
[env.preview]
vars = { ENVIRONMENT = "preview", LOG_LEVEL = "info" }

[env.preview.triggers]
crons = []

[[env.preview.d1_databases]]
binding = "DB"
database_name = "usmanalii-preview"
database_id = "PREVIEW_DB_ID_REPLACE_IN_CF_DASHBOARD"

[[env.preview.r2_buckets]]
binding = "R2_PRIVATE"
bucket_name = "usmanalii-private-preview"

[[env.preview.r2_buckets]]
binding = "R2_PUBLIC"
bucket_name = "usmanalii-public-preview"

# ---------------------------------------------------------------------------
# Staging — representative non-sensitive data only
# SECURITY: Different resource IDs from production.
# ---------------------------------------------------------------------------
[env.staging]
vars = { ENVIRONMENT = "staging", LOG_LEVEL = "info" }
route = { pattern = "staging.usmanalii.com/api/*", zone_name = "usmanalii.com" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "usmanalii-staging"
database_id = "STAGING_DB_ID_REPLACE_IN_CF_DASHBOARD"

[[env.staging.r2_buckets]]
binding = "ARTIFACTS_BUCKET"
bucket_name = "usmanalii-artifacts-staging"

[[env.staging.r2_buckets]]
binding = "R2_PRIVATE"
bucket_name = "usmanalii-artifacts-staging"

[[env.staging.r2_buckets]]
binding = "R2_PUBLIC"
bucket_name = "usmanalii-artifacts-staging"

# ---------------------------------------------------------------------------
# Production
# SECURITY: Production resource IDs are set in Cloudflare dashboard.
# ---------------------------------------------------------------------------
[env.production]
vars = { ENVIRONMENT = "production", LOG_LEVEL = "warn" }
routes = [
  { pattern = "usmanalii.com/api/*", zone_name = "usmanalii.com" },
  { pattern = "www.usmanalii.com/api/*", zone_name = "usmanalii.com" },
]

[env.production.triggers]
crons = ["0 0 * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "usmanalii-production"
database_id = "PRODUCTION_DB_ID_REPLACE_IN_CF_DASHBOARD"

[[env.production.r2_buckets]]
binding = "ARTIFACTS_BUCKET"
bucket_name = "usmanalii-artifacts-prod"

[[env.production.r2_buckets]]
binding = "R2_PRIVATE"
bucket_name = "usmanalii-private-prod"

[[env.production.r2_buckets]]
binding = "R2_PUBLIC"
bucket_name = "usmanalii-public-prod"

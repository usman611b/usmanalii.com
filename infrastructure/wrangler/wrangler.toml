# ============================================================================
# Wrangler configuration — usmanalii.com Worker API
#
# SECURITY RULES:
#  - Real resource IDs (database_id, bucket_name, etc.) are NOT committed here.
#  - Placeholder values are used and must be replaced by the owner.
#  - Secrets (OWNER_EMAIL, ACCESS_AUDIENCE, etc.) use Cloudflare secret storage.
#  - Preview environments MUST use synthetic data and non-production bindings.
#  - Production resource IDs are stored in Cloudflare dashboard, not Git.
#
# Architecture §20 (Environments and deployment).
# Security Threat Model §13 (Secrets and infrastructure).
# ============================================================================

name = "usmanalii-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = []

# ---------------------------------------------------------------------------
# D1 Databases
# SECURITY: database_id values are NOT secrets but should not point to production
# in preview/local environments. Replace placeholders with real IDs per environment.
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "usmanalii-local"
database_id = "LOCAL_PLACEHOLDER_REPLACE_IN_CF_DASHBOARD"
migrations_dir = "../../packages/database/migrations"

# ---------------------------------------------------------------------------
# R2 Buckets
# SECURITY: Private originals must NEVER have public_access = true.
# ---------------------------------------------------------------------------
[[r2_buckets]]
binding = "R2_PRIVATE"
bucket_name = "usmanalii-private-local"

[[r2_buckets]]
binding = "R2_PUBLIC"
bucket_name = "usmanalii-public-local"

# ---------------------------------------------------------------------------
# Queues — background job infrastructure
# ---------------------------------------------------------------------------
[[queues.producers]]
binding = "PUBLICATION_QUEUE"
queue = "usmanalii-publication-local"

[[queues.consumers]]
queue = "usmanalii-publication-local"
max_batch_size = 10
max_batch_timeout = 30

# ---------------------------------------------------------------------------
# Local development
# ---------------------------------------------------------------------------
[env.local]
# Uses Wrangler local emulator for D1 and R2
# Run with: wrangler dev --env local
vars = { ENVIRONMENT = "local", LOG_LEVEL = "debug" }

# NEVER commit real secrets. Use .dev.vars for local-only values.
# Copy .dev.vars.example to .dev.vars and fill in placeholder values.

# ---------------------------------------------------------------------------
# Preview (branch preview deployments)
# SECURITY: MUST use synthetic data bindings, not staging or production.
# ---------------------------------------------------------------------------
[env.preview]
vars = { ENVIRONMENT = "preview", LOG_LEVEL = "info" }

[env.preview.triggers]
crons = []

[[env.preview.d1_databases]]
binding = "DB"
database_name = "usmanalii-preview"
database_id = "PREVIEW_DB_ID_REPLACE_IN_CF_DASHBOARD"

[[env.preview.r2_buckets]]
binding = "R2_PRIVATE"
bucket_name = "usmanalii-private-preview"

[[env.preview.r2_buckets]]
binding = "R2_PUBLIC"
bucket_name = "usmanalii-public-preview"

# ---------------------------------------------------------------------------
# Staging — representative non-sensitive data only
# SECURITY: Different resource IDs from production.
# ---------------------------------------------------------------------------
[env.staging]
vars = { ENVIRONMENT = "staging", LOG_LEVEL = "info" }
route = { pattern = "staging.usmanalii.com/api/*", zone_name = "usmanalii.com" }

[[env.staging.d1_databases]]
binding = "DB"
database_name = "usmanalii-staging"
database_id = "STAGING_DB_ID_REPLACE_IN_CF_DASHBOARD"

[[env.staging.r2_buckets]]
binding = "ARTIFACTS_BUCKET"
bucket_name = "usmanalii-artifacts-staging"

[[env.staging.r2_buckets]]
binding = "R2_PRIVATE"
bucket_name = "usmanalii-artifacts-staging"

[[env.staging.r2_buckets]]
binding = "R2_PUBLIC"
bucket_name = "usmanalii-artifacts-staging"

# ---------------------------------------------------------------------------
# Production
# SECURITY: Production resource IDs are set in Cloudflare dashboard.
# The deploy token for production is least-privilege and not available to
# preview/fork builds (Security §14).
# ---------------------------------------------------------------------------
[env.production]
vars = { ENVIRONMENT = "production", LOG_LEVEL = "warn" }
route = { pattern = "usmanalii.com/api/*", zone_name = "usmanalii.com" }

[env.production.triggers]
crons = ["0 0 * * *"]

[[env.production.d1_databases]]
binding = "DB"
database_name = "usmanalii-production"
database_id = "PRODUCTION_DB_ID_REPLACE_IN_CF_DASHBOARD"

[[env.production.r2_buckets]]
binding = "ARTIFACTS_BUCKET"
bucket_name = "usmanalii-artifacts-prod"

[[env.production.r2_buckets]]
binding = "R2_PRIVATE"
bucket_name = "usmanalii-private-prod"

[[env.production.r2_buckets]]
binding = "R2_PUBLIC"
bucket_name = "usmanalii-public-prod"

[[env.production.queues.producers]]
binding = "PUBLICATION_QUEUE"
queue = "usmanalii-publication-prod"

[[env.production.queues.consumers]]
queue = "usmanalii-publication-prod"
max_batch_size = 10
max_batch_timeout = 30

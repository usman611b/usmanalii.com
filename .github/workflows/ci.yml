name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.4'

jobs:
  # ============================================================================
  # Security: Dependency audit and secret scanning
  # Must pass before any code check proceeds.
  # Security Threat Model §14 (Supply-chain and CI/CD security)
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --audit-level=high

      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # SECURITY: Fails the build if any secret pattern is detected

  # ============================================================================
  # Type checking — strict TypeScript across all packages
  # ============================================================================
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript check (all packages)
        run: pnpm typecheck

  # ============================================================================
  # Linting — ESLint with import boundaries and security rules
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (all packages)
        run: pnpm lint
      - name: Format check
        run: pnpm format:check

  # ============================================================================
  # Tests — domain invariants, authorization security tests, fixture validation
  # ============================================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        run: pnpm test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: '**/coverage/**'
          retention-days: 7

  # ============================================================================
  # Migration verification — fresh database from all migrations
  # Architecture §24 acceptance criterion #7: "All migrations reproduce an empty
  # database deterministically."
  # ============================================================================
  migrations:
    name: Migration Verification
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Wrangler
        run: pnpm add -g wrangler@3

      - name: Verify migrations on fresh database
        run: node infrastructure/scripts/verify-migrations.mjs

      - name: Verify migration file list is ordered and complete
        run: node infrastructure/scripts/check-migration-order.mjs

  # ============================================================================
  # Build — apps/web and apps/worker
  # ============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, migrations]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build all packages and apps
        run: pnpm build
        env:
          # SECURITY: No production secrets in preview/CI builds
          # Build uses synthetic data only
          ENVIRONMENT: ci
          NODE_ENV: production

  # ============================================================================
  # Accessibility smoke tests (when web app has pages)
  # Implemented in M1 — placeholder job for now
  # ============================================================================
